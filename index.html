<!DOCTYPE html> 

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Sign-up Form</title>

        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BJCree:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- custom css -->
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="main-flex-items">    
            <div class="hero-container">
                <div class="logo-wrapper">
                    <img src="giraffe-pic.svg" alt="picture logo" class="logo-pic">
                    <img src="giraffe-logo.png" alt="Letter logo for Giraffe" class="logo-letters">
                </div>
            </div>

            <div class="form-container bjcree-regular">
                <div class="top-row">
                    <p>
                        This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                        <br><br><br>
                        You <em>know </em>you want to.
                    </p>
                </div>

                <div class="middle-row">
                    <h2>Let's do this!</h2>

                    <br>

                    <form action="https://httpbin.org/post" method="post">
                        <div class="form-top-row">
                            <div>
                                <label for="fname">
                                    First Name
                                </label>
                                <input type="text" id="fname" placeholder="John" required>
                            </div>
                            <div>
                                <label for="lname">Last Name</label>
                                <input type="text" id="lname" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-mid-row">
                            <div>
                                <label for="email">Email</label>
                                <input type="email" id="email" required>
                            </div>
                            <div>
                                <label for="phone-number">Phone Number</label>
                                <input type="tel" id="phone-number">
                            </div>
                        </div>

                        <div class="form-bottom-row">
                            <div>
                                <label for="password">Password</label><input type="password" id="password" required></div>
                            <div>
                                <label for="confirmed-password">Confirm Password</label>
                                <input type="password" id="confirmed-password" required>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="bottom-row">

                </div>

            </div>
        </div>
        <!-- <footer class="bjcree-regular">ᐲᐢᑭᑕᑯᐦᐠ ᐆᒋ</footer>     -->
    </body>
</html>
